apiVersion: batch/v1
kind: Job
metadata:
  name: fraud-tuning-job
  namespace: mlops
  labels:
    app: fraud-detection
    step: tuning
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: fraud-detection
        step: tuning
    spec:
      restartPolicy: Never
      containers:
        - name: tuning
          image: ghcr.io/getaway001/fraud-detection-mlops:latest
          imagePullPolicy: Always
          command: ["python", "-m", "src.training.tune"]
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.mlops.svc.cluster.local"
            - name: PROCESSED_DIR
              value: "/app/data/processed"
            - name: OPTUNA_N_TRIALS
              value: "30"
            - name: OPTUNA_METRIC
              value: "f1"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fraud-data-pvc