# ServiceAccount que l'InferenceService référencera
# (spec.predictor.serviceAccountName). KServe monte automatiquement les
# Secrets attachés à ce ServiceAccount dans le pod de serving, pour que le
# storage-initializer puisse s'authentifier auprès de MinIO.
#
# Dépend de minio-secret.yaml (doit être appliqué avant, ou en même temps).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-minio-sa
  namespace: mlops
secrets:
  - name: minio-s3-secret