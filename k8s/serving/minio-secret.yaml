# Secret contenant les identifiants MinIO, avec les annotations spécifiques
# à KServe qui indiquent au storage-initializer comment s'y connecter
# (endpoint, HTTP vs HTTPS, etc.).
#
# Ce Secret n'est jamais référencé directement par l'InferenceService —
# c'est le ServiceAccount (voir kserve-minio-serviceaccount.yaml) qui fait
# le lien. KServe ne permet pas de monter un Secret directement sur le pod
# qu'il génère, seulement via un ServiceAccount qui le référence.
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3-secret
  namespace: mlops
  annotations:
    serving.kserve.io/s3-endpoint: "mlflow-minio.mlops.svc.cluster.local:9000"
    serving.kserve.io/s3-usehttps: "0"        # MinIO interne au cluster, pas de TLS
    serving.kserve.io/s3-verifyssl: "0"
    serving.kserve.io/s3-useanoncredential: "false"
    serving.kserve.io/s3-region: "us-east-1"  # valeur arbitraire, MinIO l'ignore mais le champ est requis
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin123