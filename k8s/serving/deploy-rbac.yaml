# ServiceAccount dédié au script deploy_champion.py, avec les permissions
# RBAC minimales nécessaires : lire et modifier les InferenceService du
# namespace mlops. Séparé du ServiceAccount kserve-minio-sa (qui sert un
# rôle différent : porter le Secret MinIO pour le storage-initializer).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-deploy-sa
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fraud-deploy-inferenceservice-editor
  namespace: mlops
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fraud-deploy-inferenceservice-editor-binding
  namespace: mlops
subjects:
  - kind: ServiceAccount
    name: fraud-deploy-sa
    namespace: mlops
roleRef:
  kind: Role
  name: fraud-deploy-inferenceservice-editor
  apiGroup: rbac.authorization.k8s.io