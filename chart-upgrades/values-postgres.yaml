postgresql:
  enabled: true
  architecture: standalone
  auth:
    username: "mlflow"
    password: "mlflow-password"
    database: "mlflow"
  primary:
    persistence:
      enabled: true

backendStore:
  databaseMigration: true

serverAllowedHosts:
  - "mlflow.mlops.svc.cluster.local"
  - "mlflow"
  - "localhost"
  - "localhost:5000"
  - "127.0.0.1"
  - "127.0.0.1:5000"