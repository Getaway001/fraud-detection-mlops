apiVersion: batch/v1
kind: Job
metadata:
  name: fraud-feature-engineering-job
  namespace: mlops
  labels:
    app: fraud-detection
    step: feature-engineering
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: fraud-detection
        step: feature-engineering
    spec:
      restartPolicy: Never
      containers:
        - name: feature-engineering
          image: fraud-detection:latest
          imagePullPolicy: Never   # image locale chargée via `minikube image load`
          command: ["python", "-m", "src.features.build_features"]
          env:
            - name: RAW_DATA_PATH
              value: "/app/data/raw/Fraud_Detection_Dataset.csv"
            - name: PROCESSED_DIR
              value: "/app/data/processed"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fraud-data-pvc
