# InferenceService KServe : sert le modèle @champion actuel du Model
# Registry MLflow, via le runtime MLServer (format "mlflow" natif).
#
# storageUri est résolu manuellement pour l'instant (via
# `python -m src.registry.resolve_champion_uri`) — automatiser cette
# résolution (générer/mettre à jour ce fichier automatiquement à chaque
# nouveau @champion) est le sujet de la session "deployment patterns" à
# venir.
#
# Dépend de : k8s/serving/minio-secret.yaml et minio-serviceaccount.yaml
# (doivent être appliqués avant).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-detection-model
  namespace: mlops
spec:
  predictor:
    serviceAccountName: kserve-minio-sa
    model:
      modelFormat:
        name: mlflow
      protocolVersion: v2
      storageUri: "s3://mlflow/2/308e79092c5348efbb96669cf09a5f05/artifacts/model"
      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1Gi"